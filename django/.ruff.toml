exclude = [".ruff_cache", "venv", "migrations"]

line-length = 88
indent-width = 4

target-version = "py39"

[lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B",
  "COM",
  "DTZ",
  "EXE",
  "PIE",
  "I",
  "DJ",
  "ERA",
  "RSE",
  "Q",
  "UP",
]
ignore = []

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
