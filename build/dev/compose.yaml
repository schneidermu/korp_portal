name: $COMPOSE_NAME

volumes:
  pg:
  caddy_data:
  django_static:

services:
  db:
    image: postgres:13.16-alpine
    volumes:
      - ./pg/init.sh:/docker-entrypoint-initdb.d/init.sh
      - pg:/var/lib/postgresql/data/
    healthcheck:
      test:
        ["CMD-SHELL", "psql -U postgres -d postgres -c 'SELECT 1' || exit 1"]
      timeout: 3s
      interval: 60s
      start_interval: 1s
      start_period: 60s
    environment:
      POSTGRES_PASSWORD: password # FIXME
      DB_COUNT: 3
      DB_1_USER: $DB_USER_DJANGO
      DB_1_NAME: $DB_NAME_DJANGO
      DB_1_PASSWORD: $DB_PASSWORD_DJANGO
      DB_2_USER: $DB_USER_LIFERAY
      DB_2_NAME: $DB_NAME_LIFERAY
      DB_2_PASSWORD: $DB_PASSWORD_LIFERAY
      DB_3_USER: $DB_USER_NEXTCLOUD
      DB_3_NAME: $DB_NAME_NEXTCLOUD
      DB_3_PASSWORD: $DB_PASSWORD_NEXTCLOUD

  django:
    build: ../../django/
    container_name: $COMPOSE_NAME-django
    stop_signal: SIGINT
    volumes:
      - ./volumes/media/:/media/
      - ./volumes/logs/:/app/logs/
      - django_static:/srv/static/
    depends_on:
      db:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: $DB_HOST_DJANGO
      DB_PORT: $DB_PORT_DJANGO
      DB_NAME: $DB_NAME_DJANGO
      DB_USER: $DB_USER_DJANGO
      DB_PASSWORD: $DB_PASSWORD_DJANGO
      DB_HOST_LIFERAY:
      DB_PORT_LIFERAY:
      DB_NAME_LIFERAY:
      DB_USER_LIFERAY:
      DB_PASSWORD_LIFERAY:
      SECRET_KEY: $DJANGO_SECRET_KEY
      ALLOWED_HOSTS: django,$DJANGO_ALLOWED_HOSTS
      DEBUG: $DJANGO_DEBUG
      CHALLENGE_URL: $DJANGO_CHALLENGE_URL
      SCRIPT_NAME: $BACKEND_PREFIX
      DJANGO_PORT:

  cron-importer:
    build:
      context: ../../
      dockerfile: ./cron/Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../django/scripts/:/app/scripts/
    depends_on:
      - django
    environment:
      NEWS_API_TOKEN:
      DJANGO_CONTAINER_NAME: $COMPOSE_NAME-django
      SCRIPT_NAME: $BACKEND_PREFIX

  liferay:
    image: liferay/portal:7.0.6-ga7
    profiles: [liferay]
    volumes:
      # Copy a .war here to deploy it.
      - ./volumes/deploy/:/mnt/liferay/deploy/
      - ./liferay/portal-ext.properties:/opt/liferay/portal-ext.properties:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: org.postgresql.Driver
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: "jdbc:postgresql://${DB_HOST_LIFERAY}:${DB_PORT_LIFERAY}/${DB_NAME_LIFERAY}"
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: $DB_USER_LIFERAY
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: $DB_PASSWORD_LIFERAY

  vite:
    build:
      context: ../../react/
      target: dev
    command: yarn dev
    volumes:
      - ../../react:/app
    environment:
      VITE_LIFERAY_EMBED: false
      VITE_BACKEND_PREFIX: $BACKEND_PREFIX
      VITE_NEXTCLOUD_PREFIX: $NEXTCLOUD_PREFIX
      VITE_EMAIL:
      VITE_PAUTH:

  nextcloud:
    image: nextcloud:31.0-fpm-alpine
    user: www-data
    profiles: [nextcloud]
    volumes:
      - ./volumes/nextcloud:/var/www/html:z
      - ../nextcloud/init.sh:/docker-entrypoint-hooks.d/post-installation/init.sh:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: $DB_HOST_NEXTCLOUD
      POSTGRES_DB: $DB_NAME_NEXTCLOUD
      POSTGRES_USER: $DB_USER_NEXTCLOUD
      POSTGRES_PASSWORD: $DB_PASSWORD_NEXTCLOUD
      NEXTCLOUD_ADMIN_USER:
      NEXTCLOUD_ADMIN_PASSWORD:
      NEXTCLOUD_PREFIX:
      NEXTCLOUD_CHALLENGE_URL:
      HOSTNAME:

  nginx:
    image: nginx:1.27-alpine
    profiles: [nextcloud]
    depends_on:
      - nextcloud
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/nextcloud:/var/www/html:z,ro

  caddy:
    image: caddy:2.10-alpine
    ports:
      - 80:80
      - 2019:2019
    volumes:
      - ./caddy/:/etc/caddy/
      - caddy_data:/data
      - ./volumes/media/:/srv/django/media/:ro
      - django_static:/srv/django/static/:ro
    environment:
      BACKEND_PREFIX:
      DJANGO_PORT:
      VITE_PREFIX:
      NEXTCLOUD_PREFIX:
