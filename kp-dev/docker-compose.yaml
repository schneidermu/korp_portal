volumes:
  pg_data:
  prometheus_data: {}
  zabbix_pg_data: {}
  zabbix_web_data: {}

services:
  database:
    image: postgres:13.16-alpine
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./database/gen/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      timeout: 3s
      interval: 60s
      start_interval: 3s
      start_period: 60s

  traefik:
    image: traefik:v3.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${TRAEFIK_PORT}:80"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:${TRAEFIK_PORT}"
      - "--providers.docker.constraints=Label(`traefik.instance`, `${TRAEFIK_INSTANCE}`)"

  liferay:
    image: liferay/portal:7.0.6-ga7
    volumes:
      # Copy a .war here to deploy it.
      - ./volumes/deploy:/mnt/liferay/deploy
      - ./liferay/portal-ext.properties:/opt/liferay/portal-ext.properties
    environment:
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: "jdbc:postgresql://database:5432/${POSTGRES_DB_LIFERAY}"
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: "${POSTGRES_USER_LIFERAY}"
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: "${POSTGRES_PASSWORD_LIFERAY}"
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.instance=kp"
      - "traefik.http.routers.liferay.rule=PathPrefix(`/`)"
      - "traefik.http.routers.liferay.entrypoints=web"
      - "traefik.http.services.liferay.loadbalancer.server.port=8080"

  django:
    build: ../django/
    environment:
      POSTGRES_USER: "${POSTGRES_USER_DJANGO}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD_DJANGO}"
      POSTGRES_DB: "${POSTGRES_DB_DJANGO}"
      POSTGRES_DB_LIFERAY: "${POSTGRES_DB_LIFERAY}"
      DB_HOST: database
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "${HOSTNAME}"
      DEBUG: "${DEBUG}"
      CHALLENGE_URL: "${CHALLENGE_URL}"
      SCRIPT_NAME: "${BACKEND_PREFIX}"
      DJANGO_PORT: 8000
    volumes:
      - ./volumes/media:/media
    depends_on:
      database:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.instance=${TRAEFIK_INSTANCE}"
      - "traefik.http.routers.django.rule=PathPrefix(`${BACKEND_PREFIX}/`)"
      - "traefik.http.routers.django.entrypoints=web"
      - "traefik.http.services.django.loadbalancer.server.port=8000"

  react:
    build:
      context: ../react/
      target: dev
    command: yarn dev
    environment:
      VITE_BACKEND_PREFIX: "${BACKEND_PREFIX}"
      VITE_LIFERAY_EMBED: false
      VITE_EMAIL: "${VITE_EMAIL}"
      VITE_PAUTH: "${VITE_PAUTH}"
    volumes:
      - ../react:/app
    labels:
      - "traefik.enable=true"
      - "traefik.instance=${TRAEFIK_INSTANCE}"
      - "traefik.http.routers.vite.rule=PathPrefix(`${FRONTEND_PREFIX}/`)"
      - "traefik.http.routers.vite.entrypoints=web"

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.instance=kp"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${HOSTNAME}`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    restart: unless-stopped

  zabbix-db:
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - zabbix_pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: "${ZABBIX_DB_NAME}"
      POSTGRES_USER: "${ZABBIX_DB_USER}"
      POSTGRES_PASSWORD: "${ZABBIX_DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ZABBIX_DB_USER}", "-d", "${ZABBIX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
      prometheus:
        condition: service_started
    environment:
      DB_SERVER_HOST: "zabbix-db"
      POSTGRES_DB: "${ZABBIX_DB_NAME}"
      POSTGRES_USER: "${ZABBIX_DB_USER}"
      POSTGRES_PASSWORD: "${ZABBIX_DB_PASSWORD}"
      ZBX_CACHESIZE: "1G" 

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: "zabbix-server"
      DB_SERVER_HOST: "zabbix-db"
      POSTGRES_DB: "${ZABBIX_DB_NAME}"
      POSTGRES_USER: "${ZABBIX_DB_USER}"
      POSTGRES_PASSWORD: "${ZABBIX_DB_PASSWORD}"
    labels:
      - "traefik.enable=true"
      - "traefik.instance=${TRAEFIK_INSTANCE}"
      - "traefik.http.routers.zabbix.rule=PathPrefix(`/zabbix/`)"
      - "traefik.http.routers.zabbix.entrypoints=web"
  whoami:
    image: containous/whoami
